name: Release

# After CI passes on main: publish the package if its version isn't on npm yet, then deploy the
# docs. A routine push only redeploys the docs; bumping the version in
# packages/cardstock/package.json is what makes a release.
#
# Publishing uses npm trusted publishing (OIDC), so there's no npm token: the package's settings
# on npmjs.com name this repo and this file as its trusted publisher. The docs deploy needs the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One release at a time, in push order; never cancel one half-way through a publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the version tag
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit CI tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Is this version new?
        id: version
        run: |
          VERSION=$(node -p "require('./packages/cardstock/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@danolekh/cardstock@$VERSION" version > /dev/null 2>&1; then
            echo "@danolekh/cardstock@$VERSION is already on npm; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.version.outputs.new == 'true'
        run: pnpm --filter @danolekh/cardstock build
      # Trusted publishing needs npm 11.5.1 or later.
      - if: steps.version.outputs.new == 'true'
        run: npm install --global npm@latest
      - if: steps.version.outputs.new == 'true'
        name: Publish
        working-directory: packages/cardstock
        run: npm publish --access public
      - if: steps.version.outputs.new == 'true'
        name: Tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

  docs:
    # After the publish (or its skip), so the site never documents a version that isn't out.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=docs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: deploy
          packageManager: pnpm
